# ChargeWise on a NAS — 24/7 API + daily ingestion.
#
# Deploy with docker-compose (or the NAS's own container manager) pointed at
# this file, with the repo's backend/ folder, a .env and (optionally) an
# existing data/ SQLite DB alongside it. See docs/PROJECT-STATUS.md
# (operations). The scheduler names vehicles from VEHICLE_MAP in that .env
# (see .env.example).
#
# Services share one image:
#   api        — serves the dashboard/HA on port 8000, restarts on boot
#   scheduler  — daily incremental pipeline run (last 35 days of TeslaFi,
#                fresh Octopus rates/dispatches, weekly GOV.UK fuel prices)

# version key kept for older docker-compose v1 releases (harmless elsewhere)
version: "3.3"

services:
  api:
    build: ./backend
    image: chargewise-backend
    container_name: chargewise-api
    env_file: .env
    environment:
      - TZ=Europe/London
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  scheduler:
    image: chargewise-backend
    container_name: chargewise-scheduler
    env_file: .env
    environment:
      - TZ=Europe/London
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped
    # Daily loop lives in a real script — an inline YAML-folded command
    # arrived as invalid sh and crash-looped (11 Jul 2026). Never inline it.
    command: ["sh", "/app/scheduler.sh"]
